spring.application.name=barberia-reservas

# --- Base de datos (los valores por defecto sirven para desarrollo local) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:barberia}
spring.datasource.username=${DB_USER:barberia}
spring.datasource.password=${DB_PASSWORD:barberia_dev}

# --- JPA ---
# "validate": Hibernate solo COMPRUEBA que las entidades coincidan con las tablas.
# El esquema lo manda Flyway (db/migration), nunca Hibernate. Así el esquema queda versionado.
spring.jpa.hibernate.ddl-auto=validate
# Evita consultas a la base de datos "escondidas" mientras se arma la respuesta HTTP.
spring.jpa.open-in-view=false

# --- Flyway (migraciones en src/main/resources/db/migration) ---
spring.flyway.enabled=true

# --- Reglas de reservas ---
app.reservas.zona-horaria=America/Santiago
app.reservas.duracion-minutos=60
# 1 = como maximo hasta el dia anterior
app.reservas.dias-minimos-anticipacion=1
app.reservas.dias-maximos-anticipacion=30
app.reservas.max-solicitudes-pendientes-por-telefono=2

   # --- Administrador inicial (se crea al arrancar si no existe ninguno) ---
   app.admin.email=${ADMIN_EMAIL:}
   app.admin.password=${ADMIN_PASSWORD:}

   # --- Sesion del administrador ---
   server.servlet.session.timeout=2h
   server.servlet.session.cookie.http-only=true
   server.servlet.session.cookie.same-site=lax
   # En produccion (HTTPS) agregar: server.servlet.session.cookie.secure=true

      # --- Datos publicos del negocio (los muestra la pagina de reservas) ---
   app.negocio.nombre=Mi Barberia
   # Opcional: WhatsApp del barbero con codigo de pais (ejemplo: +56912345678). Si queda vacio, no se muestra el boton.
   app.negocio.whatsapp=