# Base de datos local para desarrollo.
# Levantar:  docker compose up -d
# Bajar:     docker compose down   (agrega -v si quieres borrar los datos)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-barberia}
      POSTGRES_USER: ${DB_USER:-barberia}
      # Valor por defecto SOLO para desarrollo local. En producción va por variable de entorno.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-barberia_dev}
    ports:
      # Solo escucha en tu computador (127.0.0.1), no en toda la red.
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  db_data:
